<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Ransomware Attack Lifecycle & Kill Chain Simulator. Explore the 5 critical stages: Initial Access, Privilege Escalation, Encryption, Ransom, and Decryption." />
  <title>Ransomware Attack Lifecycle Simulator // MITRE ATT&CK Kill Chain Explorer</title>
  
  <!-- Modern Google Fonts: Plus Jakarta Sans for UI + JetBrains Mono for Code & Hashes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./index.css" />
</head>
<body class="cyber-theme-dark">
  <div class="app-layout" id="app-root">
    <!-- Left Sidebar: The 5 Steps of Ransomware Navigation & Host Telemetry -->
    <div id="sidebar-container" class="sidebar-slot"></div>

    <!-- Main Viewport Area -->
    <main class="main-content-slot" id="main-content" role="main">
      <!-- Top Navigation & Utility Header -->
      <header class="top-nav-bar" id="top-nav-bar">
        <div class="top-nav-left">
          <div class="environment-badge">
            <span class="live-pulse"></span>
            <span class="font-mono text-xs">CYBER RANGE SIMULATION SANDBOX</span>
          </div>
          <span class="nav-separator">/</span>
          <span class="top-nav-scope font-mono text-xs text-muted">TARGET: CORP-FIN-SRV01 (192.168.4.120)</span>
        </div>

        <div class="top-nav-right font-mono text-xs">
          <div class="defense-mode-indicator">
            <span class="mode-label text-muted">PROFILE:</span>
            <span class="mode-value text-highlight">HYBRID DOUBLE-EXTORTION</span>
          </div>
          <a href="#telemetry-terminal-drawer" class="top-nav-btn font-mono" id="top-nav-telemetry-btn" title="Jump to Telemetry Feed">
            <span class="nav-btn-icon">⚡</span> EDR FEED
          </a>
        </div>
      </header>

      <!-- Active Stage Viewport Component Container -->
      <section class="stage-viewport-container" id="stage-viewport" aria-live="polite">
        <!-- Rendered dynamically by active stage component -->
      </section>

      <!-- Bottom Collapsible Live Telemetry & EDR Terminal -->
      <footer class="bottom-terminal-slot" id="terminal-container"></footer>
    </main>
  </div>

  <!-- Application Script (ES Module) -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
